<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — ТЕЛЕ 3</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body{background:linear-gradient(135deg,#1a3a6b 0%,#0d1f3c 100%);min-height:100vh;display:flex;align-items:center;}
  .login-card{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:420px;width:100%;}
  .brand-logo{font-size:2rem;font-weight:900;color:#1a3a6b;}
  .brand-logo span{color:#e8251f;}
  .btn-login{background:#e8251f;border:none;font-weight:600;letter-spacing:.5px;}
  .btn-login:hover{background:#c41e1a;}
  .form-control:focus{border-color:#1a3a6b;box-shadow:0 0 0 .2rem rgba(26,58,107,.25);}
</style>
</head>
<body>
<div class="container d-flex justify-content-center">
  <div class="login-card card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-logo">ТЕЛЕ<span>3</span></div>
      <p class="text-muted small mt-1">Информационная система оператора</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold">Логин</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Введите логин" autocomplete="username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Пароль</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Введите пароль" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-danger w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Войти в систему
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      <i class="bi bi-shield-lock me-1"></i>Защищённое соединение
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
