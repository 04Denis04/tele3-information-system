{% extends "base.html" %}
{% block title %}{{ "Добавить услугу" if not service else "Редактировать" }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ "Добавить услугу" if not service else "Редактировать: " + service.name }}</h4>
<div class="card p-4" style="max-width:400px">
  <form method="POST">
    <div class="mb-3"><label class="form-label">Название *</label>
      <input type="text" name="name" class="form-control" value="{{ service.name if service else "" }}" required></div>
    <div class="mb-3"><label class="form-label">Стоимость (₽/мес)</label>
      <input type="number" name="cost" class="form-control" step="0.01" min="0" value="{{ service.cost if service else 0 }}"></div>
    <div class="mb-4"><label class="form-label">Описание</label>
      <textarea name="description" class="form-control" rows="3">{{ service.description if service else "" }}</textarea></div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{{ url_for("services.index") }}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
