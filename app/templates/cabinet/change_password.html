{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h4 class="mb-3">Смена пароля</h4>
<div class="card p-4" style="max-width:400px">
  <form method="POST">
    <div class="mb-3"><label class="form-label">Текущий пароль</label>
      <input type="password" name="old_password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Новый пароль</label>
      <input type="password" name="new_password" class="form-control" required minlength="6"></div>
    <div class="mb-4"><label class="form-label">Повторите новый пароль</label>
      <input type="password" name="confirm_password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for("cabinet.index") }}" class="btn btn-outline-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}
