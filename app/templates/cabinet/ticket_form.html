{% extends "base.html" %}
{% block title %}Новое обращение{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card p-4">
      <h5 class="mb-4"><i class="bi bi-headset me-2 text-warning"></i>Новое обращение в поддержку</h5>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Тема обращения</label>
          <input type="text" name="subject" class="form-control" placeholder="Кратко опишите проблему" required maxlength="200">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Подробное описание</label>
          <textarea name="body" class="form-control" rows="5" placeholder="Опишите проблему подробно..." required></textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">
          <i class="bi bi-send me-1"></i>Отправить обращение
        </button>
        <a href="{{ url_for('cabinet.my_tickets') }}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
